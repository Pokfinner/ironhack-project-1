apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - name: result
        image: cesarboada/result:latest  # Use your Docker Hub image
        ports:
          - containerPort: 80
        env:
          - name: PG_HOST
            value: postgres-service
          - name: PG_PORT
            value: "5432"
          - name: PG_USER
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: POSTGRES_USER
          - name: PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: POSTGRES_PASSWORD
          - name: PG_DATABASE
            value: votes