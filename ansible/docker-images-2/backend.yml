# Ironhack note - This file is for running in docker compose with prebuilt images
# Use these if you're stuck, or if you want to start slowly migrating from external images into your own.

services:
  worker:
 #  build: ./worker
    image: cocomo1/worker:latest
    environment:
      REDIS_HOST: "10.0.2.171"
      REDIS_PORT: "6379"
      PG_HOST: "10.0.2.53"
      DB_HOST: "10.0.2.53"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "postgres"
    networks:
      - back-tier

  redis:
    image: redis:alpine
    ports:
    - "6379:6379"
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"

volumes:
  db-data:

networks:
  back-tier: