---
- name: Pull and run result app from docker hub to EC2 instance 
  hosts: frontend
  become: true

  vars_files:
  - secrets.yml
  vars:
    app_image: yogeshrathore29/result-app
    app_tag: latest
    container_port: 80
    host_port: 81

  tasks:
    - name: Pull the image for result app
      community.docker.docker_image:
        name: "{{ app_image }}:{{ app_tag }}"
        source: pull
        force_source: true

    - name: Run the container
      community.docker.docker_container:
        name: result-app
        image: "{{ app_image }}:{{ app_tag }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:{{ container_port }}"
        env:
          PORT: "80"
          PG_HOST: "{{ db_host }}" 
          PG_PORT: "5432" 
          PG_USER: "{{ postgres_user }}"
          PG_PASSWORD: "{{ postgress_password }}"
          PG_DATABASE: "{{ postgress_db }}"
      no_log: true